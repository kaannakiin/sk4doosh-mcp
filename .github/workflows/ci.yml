name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job is opt-in. The matrix spans four runners and two of them are macOS,
# which bills at ten times the Linux rate, so a round that nobody asked for is
# the most expensive thing this file can do. Put [ci] in the commit message, or
# dispatch it; a pull request alone never starts one.
jobs:
  native:
    name: secure files (${{ matrix.target.id }}, Node ${{ matrix.node }})
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[ci]')
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        # Only Node 24 uploads a prebuild, so the Node 22 legs are pure
        # compatibility checks and double the bill for no artifact. They run on
        # a dispatched round — which is what a native release is — or when a
        # commit asks for them with [node22].
        node: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[node22]')) && fromJSON('[22, 24]') || fromJSON('[24]') }}
        # pdf: whether the PDF engine publishes a prebuilt binary for this
        # target. @firecrawl/pdf-inspector ships no darwin-x64 build and its
        # wasm fallback is unpublished, so @sk-mcp/pdf-mcp is left out of that
        # leg rather than failing it.
        target:
          - { id: linux-x64, os: ubuntu-24.04, pdf: true }
          - { id: linux-arm64, os: ubuntu-24.04-arm, pdf: true }
          - { id: darwin-x64, os: macos-15-intel, pdf: false }
          - { id: darwin-arm64, os: macos-15, pdf: true }
          - { id: win32-x64, os: windows-2022, pdf: true }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/prepare-native.mjs
      - run: pnpm turbo run test check-types --filter=@sk-mcp/file-core-native --filter=@sk-mcp/mcp-core --filter=@sk-mcp/db-core --filter=@sk-mcp/mssql-mcp --filter=@sk-mcp/file-core --filter=@sk-mcp/ooxml-core --filter=@sk-mcp/excel-mcp --filter=@sk-mcp/xml-mcp --filter=@sk-mcp/llm-mcp ${{ matrix.target.pdf && '--filter=@sk-mcp/pdf-mcp --filter=@sk-mcp/pdf-raster-pdfjs --filter=@sk-mcp/ocr-ollama' || '' }}
      - run: pnpm pack --filter=@sk-mcp/file-core-native --filter=@sk-mcp/mcp-core --filter=@sk-mcp/db-core --filter=@sk-mcp/mssql-mcp --filter=@sk-mcp/file-core --filter=@sk-mcp/ooxml-core --filter=@sk-mcp/excel-mcp --filter=@sk-mcp/xml-mcp --filter=@sk-mcp/llm-mcp ${{ matrix.target.pdf && '--filter=@sk-mcp/pdf-mcp --filter=@sk-mcp/pdf-raster-pdfjs --filter=@sk-mcp/ocr-ollama' || '' }} --pack-destination ./local/native-tarballs
      - run: python3 .github/scripts/check-npm-tarballs.py local/native-tarballs
      - run: node .github/scripts/smoke-file-packages.mjs local/native-tarballs
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: native-${{ matrix.target.id }}
          path: packages/cores/file-core-native/prebuilds/
          if-no-files-found: error

  node:
    name: build, lint, types, fixtures
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build check-types lint validate --filter='!@chat/*'
      - run: pnpm turbo run format:check
      - run: pnpm turbo run test --filter='!@sk-mcp/sdk-dotnet' --filter='!@chat/*'

  dotnet:
    name: dotnet test (net8.0 + net10.0)
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: pnpm install --frozen-lockfile
      - run: node packages/http/conformance/validate.mjs
      - run: pnpm turbo run test --filter=@sk-mcp/sdk-dotnet

  pack:
    name: pack SkMcp.AspNetCore
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    needs: [node, dotnet, native]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run pack --filter=@sk-mcp/sdk-dotnet
      - uses: actions/upload-artifact@v4
        with:
          name: SkMcp.AspNetCore-nupkg
          path: sdks/dotnet/local/nupkg-feed/*
      - run: pnpm turbo run build --filter=@sk-mcp/mcp-core --filter=@sk-mcp/db-core --filter=@sk-mcp/mssql-mcp --filter=@sk-mcp/file-core --filter=@sk-mcp/ooxml-core --filter=@sk-mcp/excel-mcp --filter=@sk-mcp/xml-mcp --filter=@sk-mcp/pdf-mcp --filter=@sk-mcp/pdf-raster-pdfjs --filter=@sk-mcp/ocr-ollama --filter=@sk-mcp/llm-mcp
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: packages/cores/file-core-native/prebuilds/
          merge-multiple: true
      - run: pnpm pack --filter=@sk-mcp/file-core-native --filter=@sk-mcp/mcp-core --filter=@sk-mcp/db-core --filter=@sk-mcp/mssql-mcp --filter=@sk-mcp/file-core --filter=@sk-mcp/ooxml-core --filter=@sk-mcp/excel-mcp --filter=@sk-mcp/xml-mcp --filter=@sk-mcp/pdf-mcp --filter=@sk-mcp/llm-mcp --pack-destination ./local/npm-tarballs
      - run: python3 .github/scripts/check-npm-tarballs.py local/npm-tarballs
        env:
          SKMCP_REQUIRE_ALL_PREBUILDS: "1"
      - run: node .github/scripts/smoke-file-packages.mjs local/npm-tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: local/npm-tarballs/*.tgz
