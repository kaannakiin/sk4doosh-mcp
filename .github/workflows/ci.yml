name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: build, lint, types, fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build check-types lint validate
      - run: pnpm turbo run test --filter=@sk-mcp/core --filter=@sk-mcp/sdk-nestjs

  dotnet:
    name: dotnet test (net8.0 + net10.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: pnpm install --frozen-lockfile
      - run: node packages/conformance/validate.mjs
      - run: pnpm turbo run test --filter=@sk-mcp/sdk-dotnet

  pack:
    name: pack SkMcp.AspNetCore
    runs-on: ubuntu-latest
    needs: [node, dotnet]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run pack --filter=@sk-mcp/sdk-dotnet
      - uses: actions/upload-artifact@v4
        with:
          name: SkMcp.AspNetCore-nupkg
          path: sdks/dotnet/local/nupkg-feed/*
