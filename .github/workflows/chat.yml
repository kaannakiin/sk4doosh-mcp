name: chat

on:
  workflow_dispatch:

concurrency:
  group: chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat:
    name: chat (build, types, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build check-types lint --filter='@chat/*'
      - run: pnpm turbo run test --filter='@chat/*'
